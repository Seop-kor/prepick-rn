# AC-9, AC-10, AC-11: 홈은 진행 중 주문을 함께 불러오고, 주문 바를 누르면 건수에 맞는 화면으로 이동한다
appId: com.anonymous.prepickrn
tags:
  - orders
  - home
---
- runFlow: subflows/launch-and-login.yaml
- extendedWaitUntil:
    notVisible: '불러오는 중'
    timeout: 20000
- assertNotVisible: '정보를 불러오지 못했어요'

# 진행 중 주문이 여러 건이면 주문내역 목록으로 이동한다
- runFlow:
    when:
      visible: '진행 중인 주문, .* 외 \d+건 진행 중'
    commands:
      - tapOn: '진행 중인 주문, .*'
      - assertNotVisible: '주문 상세'
      - extendedWaitUntil:
          visible: '.*(주문 확인 중|주문 접수|메뉴 준비 중|준비 완료).*'
          timeout: 20000

# 한 건이면 그 주문의 상세로 이동한다
- runFlow:
    when:
      visible: '진행 중인 주문, .*'
      notVisible: '진행 중인 주문, .* 외 \d+건 진행 중'
    commands:
      - tapOn: '진행 중인 주문, .*'
      - assertVisible: '주문 상세'
      - extendedWaitUntil:
          visible: '총 주문 금액'
          timeout: 20000
      - assertVisible: '.*(주문을 확인하고 있어요|주문이 접수됐어요|메뉴를 만들고 있어요|카운터에서 받아가세요).*'
